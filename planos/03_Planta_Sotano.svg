<svg viewBox="0 -35 850 720" class="w-full max-w-[700px] h-auto select-none">
  <rect x="-100.0" y="-135.0" width="1050.0" height="920.0" fill="#ffffff"/>
          <!-- RÓTULO EXTERIOR DE ORIENTACIÓN SUR (FUERA DEL PLANO) -->
          <text x="420" y="-12" fill="#0f172a" font-size="13" font-weight="extrabold" text-anchor="middle" letter-spacing="2">▲ ORIENTACIÓN SUR ▲</text>

          <!-- BRÚJULA ARQUITECTÓNICA: SUR, NORTE, ESTE Y OESTE -->
          <g id="brujula-sotano" transform="translate(775, 65)">
            <circle cx="0" cy="0" r="32" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
            <circle cx="0" cy="0" r="25" fill="none" stroke="#f1f5f9" stroke-width="1"/>
            <line x1="0" y1="-25" x2="0" y2="-21" stroke="#0f172a" stroke-width="1.5"/>
            <line x1="0" y1="25" x2="0" y2="21" stroke="#dc2626" stroke-width="1.5"/>
            <line x1="-25" y1="0" x2="-21" y2="0" stroke="#64748b" stroke-width="1.2"/>
            <line x1="25" y1="0" x2="21" y2="0" stroke="#64748b" stroke-width="1.2"/>
            <polygon points="0,0 -2.5,-2 -17,0 0,0" fill="#94a3b8"/>
            <polygon points="0,0 -2.5,2 -17,0 0,0" fill="#cbd5e1"/>
            <polygon points="0,0 2.5,-2 17,0 0,0" fill="#cbd5e1"/>
            <polygon points="0,0 2.5,2 17,0 0,0" fill="#94a3b8"/>
            <polygon points="0,0 -3,-2.5 0,-21 0,0" fill="#475569"/>
            <polygon points="0,0 3,-2.5 0,-21 0,0" fill="#0f172a"/>
            <polygon points="0,0 -3,2.5 0,21 0,0" fill="#b91c1c"/>
            <polygon points="0,0 3,2.5 0,21 0,0" fill="#dc2626"/>
            <circle cx="0" cy="0" r="3" fill="#ffffff" stroke="#0f172a" stroke-width="1.5"/>
            <text x="0" y="-36" fill="#0f172a" font-size="11" font-weight="bold" text-anchor="middle">S</text>
            <text x="0" y="46" fill="#dc2626" font-size="12" font-weight="800" text-anchor="middle">N</text>
            <text x="-38" y="4" fill="#475569" font-size="10" font-weight="bold" text-anchor="middle">E</text>
            <text x="38" y="4" fill="#475569" font-size="10" font-weight="bold" text-anchor="middle">O</text>
          </g>

          <!-- ========================================== -->
          <!-- PLANTA SÓTANO IRREGULAR CON LUZ NATURAL -->
          <!-- ========================================== -->
          <!-- ========================================== -->
          <!-- PLANTA SÓTANO IRREGULAR CON LUZ NATURAL -->
          <!-- ========================================== -->
          <!-- 1. PATIO (A NIVEL DE PLANTA BAJA) -->
          <rect x="136" y="495" width="224" height="105" fill="#f8fafc" stroke="#94a3b8" stroke-dasharray="5,4" stroke-width="1.5" rx="4"/>
          <text x="248" y="550" fill="#0f172a" font-size="13" font-weight="bold" text-anchor="middle">PATIO</text>
          <text x="248" y="568" fill="#64748b" font-size="9" text-anchor="middle">(Nivel Planta Baja)</text>

          <!-- 2. MUROS PERIMETRALES EXTERIORES DEL SÓTANO (FORMA IRREGULAR ESCALONADA) -->
          <!-- Muro Superior Sur (Calle) -->
          <rect x="120" y="64" width="600" height="16" fill="#0f172a"/>
          <!-- Muro Exterior Medianero Izquierdo (Llega hasta el final del despacho en Y:495) -->
          <rect x="120" y="80" width="16" height="425" fill="#0f172a"/>
          <!-- Muro Medianero Derecho (Completo hasta el fondo Norte en Y:600) -->
          <rect x="704" y="80" width="16" height="526" fill="#0f172a"/>
          <!-- Muro Exterior Fondo Norte de la Sala Diáfana (Derecha) -->
          <rect x="360" y="590" width="360" height="16" fill="#0f172a"/>
          <!-- Muro Retranqueo Vertical de la Sala Diáfana (Da al patio) -->
          <rect x="360" y="495" width="10" height="105" fill="#0f172a"/>

          <!-- 3. ARMARIO EMPOTRADO ENTRE ESCALERA Y DESPACHO (OCUPA TODO EL HUECO DESDE EL TABIQUE HASTA LA ESCALERA) -->
          <g id="armario-sotano">
            <rect x="136" y="164" width="84" height="126" fill="#f8fafc" stroke="#0f172a" stroke-width="2" rx="2"/>
            <text x="178" y="231" fill="#0f172a" font-size="11" font-weight="bold" text-anchor="middle">ARMARIO</text>
          </g>

          <!-- 4. DESPACHO INDEPENDIENTE (TABIQUES NORMALIZADOS EN NEGRO) -->
          <g id="despacho-sotano">
            <!-- Suelo interior despacho -->
            <rect x="136" y="295" width="224" height="200" fill="#f8fafc"/>

            <!-- TABIQUE SUPERIOR -->
            <rect x="136" y="290" width="149" height="10" fill="#0f172a"/>
            <!-- Vano / Hueco de la Puerta en el Tabique (a espesor completo de tabique) -->
            <rect x="285" y="290" width="65" height="10" fill="#ffffff"/>
            <!-- Tramo final del tabique junto a la esquina derecha -->
            <rect x="350" y="290" width="10" height="10" fill="#0f172a"/>

            <!-- Paso de Entrada al Despacho (Hueco de puerta) -->
            <!-- Vano abierto sin texto -->

            <!-- TABIQUE LATERAL DERECHO -->
            <rect x="355" y="290" width="10" height="210" fill="#0f172a"/>

            <!-- TABIQUE INFERIOR (Con entrada de luz natural) -->
            <rect x="136" y="490" width="229" height="10" fill="#0f172a"/>

            <!-- ENTRADA HORIZONTAL DE LUZ NATURAL EN EL DESPACHO (Ventana alta ~0,50 m bajo techo) -->
            <rect x="175" y="488" width="145" height="14" fill="#e0f2fe" stroke="#0284c7" stroke-width="2" rx="2"/>
            <text x="247" y="480" fill="#0284c7" font-size="9" font-weight="bold" text-anchor="middle">Entrada de luz natural (~0,50 m bajo techo)</text>

            <!-- Rótulos del Despacho -->
            <text x="245" y="390" fill="#0f172a" font-size="15" font-weight="bold" text-anchor="middle">DESPACHO</text>
            <text x="245" y="415" fill="#0f172a" font-size="13" font-mono="true" font-weight="bold" text-anchor="middle">15,00 m²</text>
          </g>

          <!-- 5. SALA DIÁFANA (ESPACIO POLIVALENTE ABIERTO) -->
          <g id="sala-diafana-sotano">
            <!-- Suelo de la sala diáfana: cubre todo el paso superior (desde X:300) y la nave derecha hasta el fondo -->
            <rect x="300" y="80" width="404" height="210" fill="#f8fafc"/>
            <rect x="370" y="290" width="334" height="300" fill="#f8fafc"/>

            <!-- ENTRADA VERTICAL DE LUZ NATURAL EN SALA DIÁFANA (Mismo canto de 14px que la ventana del despacho) -->
            <rect x="358" y="515" width="14" height="65" fill="#e0f2fe" stroke="#0284c7" stroke-width="2" rx="2"/>
            <text x="388" y="550" fill="#0284c7" font-size="8" font-weight="bold" text-anchor="middle" transform="rotate(-90 388 550)">Entrada de luz natural</text>

            <text x="535" y="275" fill="#0f172a" font-size="19" font-weight="extrabold" text-anchor="middle">SALA DIÁFANA</text>
            <text x="535" y="302" fill="#0f172a" font-size="14" font-mono="true" font-weight="bold" text-anchor="middle">37,00 m²</text>
            <text x="535" y="326" fill="#4f46e5" font-size="11" font-weight="bold" text-anchor="middle">Espacio Polivalente Abierto</text>
          </g>

          <!-- 6. ESCALERA EN EL ESTE (HUECO RECTANGULAR COMPLETO Y NÍTIDO: 160 × 76 px) -->
          <g id="escalera-rectangular-sotano">
            <rect x="140" y="88" width="160" height="76" rx="3" fill="#fdf2f8" stroke="#dc2626" stroke-width="2.5"/>
            <!-- Eje longitudinal que separa los dos tramos -->
            <line x1="140" y1="126" x2="300" y2="126" stroke="#b91c1c" stroke-width="1.5"/>
            <!-- Peldaños verticales a lo largo de la escalera -->
            <line x1="160" y1="88" x2="160" y2="164" stroke="#b91c1c" stroke-width="1"/>
            <line x1="180" y1="88" x2="180" y2="164" stroke="#b91c1c" stroke-width="1"/>
            <line x1="200" y1="88" x2="200" y2="164" stroke="#b91c1c" stroke-width="1"/>
            <line x1="220" y1="88" x2="220" y2="164" stroke="#b91c1c" stroke-width="1"/>
            <line x1="240" y1="88" x2="240" y2="164" stroke="#b91c1c" stroke-width="1"/>
            <line x1="260" y1="88" x2="260" y2="164" stroke="#b91c1c" stroke-width="1"/>
            <line x1="280" y1="88" x2="280" y2="164" stroke="#b91c1c" stroke-width="1"/>
            <!-- Rótulo único dentro del dibujo -->
            <rect x="180" y="115" width="80" height="22" rx="4" fill="#ffffff" stroke="#dc2626" stroke-width="1.5"/>
            <text x="220" y="130" fill="#dc2626" font-size="9.5" font-weight="bold" text-anchor="middle">ESCALERA</text>
          </g>

          <!-- RÓTULO EXTERIOR DE ORIENTACIÓN NORTE (FUERA DEL PLANO) -->
          <text x="420" y="665" fill="#dc2626" font-size="13" font-weight="extrabold" text-anchor="middle" letter-spacing="2">▼ ORIENTACIÓN NORTE ▼</text>
        </svg>